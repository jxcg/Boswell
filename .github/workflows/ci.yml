name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (macOS)
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Test setup without network
        run: .agents/tests/setup_test.sh
      - name: Build and test Core
        run: .agents/setup --run-tests

  app:
    name: iPhone app
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check Xcode and iOS platform
        run: |
          xcodebuild -version
          xcodebuild -version | grep -Eq '^Xcode 27([.]|$)'
          xcodebuild -showsdks
          xcrun --sdk iphonesimulator --show-sdk-path
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned simulator app
        run: >-
          xcodebuild build
          -project Boswell.xcodeproj
          -scheme Boswell
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
